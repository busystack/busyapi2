# Native family conformance fixture
openapi: 3.2.1
servers:
  - url: https://api.invalid/v1
info:
  title: Native 雪😀
  version: business-version
paths:
  /pets/{id}:
    get:
      operationId: getPet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Pet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
              example:
                id: 9007199254740993.00
                name: 雪😀
components:
