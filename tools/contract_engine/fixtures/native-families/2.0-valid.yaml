# Native family conformance fixture
swagger: "2.0"
host: api.invalid
schemes:
  - https
basePath: /v1
produces:
  - application/json
info:
  title: Native 雪😀
  version: business-version
paths:
  /pets/{id}:
    get:
      operationId: getPet
      parameters:
        - name: id
          in: path
          required: true
          type: integer
      responses:
        "200":
          description: Pet
          schema:
            $ref: "#/definitions/Pet"
          examples:
            application/json:
              id: 9007199254740993.00
              name: 雪😀
definitions:
  Pet:
    type: object
