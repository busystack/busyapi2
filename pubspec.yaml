name: busyapi
description: Native source-preserving OpenAPI workspace.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.13.4 <4.0.0'
  flutter: 3.47.5
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  busyapi_core:
    path: packages/busyapi_core
  dbus: 0.7.13
  file_selector: 1.1.0
  flutter_riverpod: 3.3.2
  flutter_svg: 2.3.0
  path: 1.9.1
  window_manager: 0.5.2
  yaru: 10.2.0
  intl: 0.20.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/busyapi_logo.svg
